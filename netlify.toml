[build]
  # Specify the build command
  command = "npm run build"

  # Specify the publish directory (Next.js output)
  publish = ".next"

[build.environment]
  # Use Node.js 24 (LTS, supported until April 2028)
  NODE_VERSION = "24"

[[plugins]]
  # Essential Next.js plugin for Netlify
  package = "@netlify/plugin-nextjs"

# existentialchicken.com is an alias of this site; send it to the product page
[[redirects]]
  from = "https://existentialchicken.com/*"
  to = "https://husk.co/existential-chicken"
  status = 301
  force = true

[[redirects]]
  from = "https://www.existentialchicken.com/*"
  to = "https://husk.co/existential-chicken"
  status = 301
  force = true

[[redirects]]
  from = "http://existentialchicken.com/*"
  to = "https://husk.co/existential-chicken"
  status = 301
  force = true

[[redirects]]
  from = "http://www.existentialchicken.com/*"
  to = "https://husk.co/existential-chicken"
  status = 301
  force = true
